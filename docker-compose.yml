services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: payments
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 images keep data under a versioned subdirectory
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/payments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8000}:8000"

volumes:
  pgdata:
